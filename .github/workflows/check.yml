name: Check

# The lint and test set of the full build, without the phone-side packaging
# that needs a dump of this phone, and limited to the crates a venus change
# touches so a fork can prove those compile before anything is built.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: >-
          cargo clippy --locked
          -p skyward -p skyward-sys -p skyward-crypto -p skyward-block
          --all-targets -- -D warnings
      - name: Test the crates this touches
        run: >-
          cargo test --locked
          -p skyward -p skyward-sys -p skyward-crypto -p skyward-block
      - name: Lint what runs on the phone
        run: >-
          cargo ndk -t arm64-v8a --platform 30 clippy --locked
          -p skyward -p skyward-sys -p skyward-crypto -p skyward-block
          --all-targets -- -D warnings